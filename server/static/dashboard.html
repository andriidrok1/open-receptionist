<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --primary: #6c5ce7;
    --primary-bar: #7b74ec;
    --primary-soft: #efecfd;
    --ink: #1b1f2a;
    --ink-2: #6b7280;
    --muted: #9aa1ad;
    --hair: #edeef2;
    --track: #eef0f4;
    --good: #22b563;
    --good-soft: #e8f7ee;
    --warn: #f0993a;
    --warn-soft: #fff1e3;
    --crit: #ef5350;
    --crit-soft: #fdeaea;
    --good-ink: #16a34a;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-size: 14px; }
  a { color: inherit; }
  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar (desktop) ---------- */
  .sidebar {
    width: 248px; flex: none; background: var(--surface);
    border-right: 1px solid var(--hair); display: flex; flex-direction: column;
    padding: 24px 16px; position: sticky; top: 0; height: 100vh;
  }
  .brand { text-align: center; padding: 4px 0 20px; border-bottom: 1px solid var(--hair); }
  .crest {
    width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 50%;
    display: grid; place-items: center; border: 2px solid var(--primary);
    color: var(--primary);
  }
  .brand-name { font-weight: 700; letter-spacing: .14em; font-size: 15px; }
  .brand-city { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav button {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border-radius: 11px; color: var(--ink-2); font-weight: 500; font-size: 14px;
    background: none; border: 0; cursor: pointer; text-align: left; width: 100%;
    font-family: inherit;
  }
  .nav button svg { width: 20px; height: 20px; stroke: currentColor; flex: none; }
  .nav button:hover { background: #f7f7fa; color: var(--ink); }
  .nav button.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .nav .count {
    margin-left: auto; background: var(--crit); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; min-width: 20px; height: 20px;
    display: grid; place-items: center; padding: 0 6px;
  }

  .agent-card { border: 1px solid var(--hair); border-radius: 14px; padding: 14px; margin-top: 16px; }
  .agent-row { display: flex; align-items: center; gap: 11px; }
  .agent-mic {
    width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
    display: grid; place-items: center; color: #fff; flex: none;
  }
  .agent-mic svg { width: 20px; height: 20px; }
  .agent-role { font-size: 11px; color: var(--muted); }
  .agent-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .agent-state { font-size: 12px; color: var(--good-ink); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
  .signout {
    margin-top: 10px; text-align: center; display: block; color: var(--muted);
    font-size: 12px; text-decoration: none; padding: 6px;
  }
  .signout:hover { color: var(--ink); }

  /* ---------- Bottom nav (mobile) ---------- */
  .tabbar { display: none; }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .tabbar {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--surface); border-top: 1px solid var(--hair);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .tabbar button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: 0; color: var(--ink-2); font-size: 11px; font-weight: 600;
      padding: 6px 0; cursor: pointer; position: relative; font-family: inherit;
    }
    .tabbar button.active { color: var(--primary); }
    .tabbar button svg { width: 22px; height: 22px; stroke: currentColor; }
    .tabbar .count {
      position: absolute; top: 0; left: calc(50% + 6px);
      background: var(--crit); color: #fff; border-radius: 999px;
      font-size: 10px; font-weight: 700; min-width: 17px; height: 17px;
      display: grid; place-items: center; padding: 0 5px;
    }
    .main { padding-bottom: 84px !important; }
  }

  /* ---------- Main ---------- */
  .main { flex: 1; padding: 26px 30px; min-width: 0; }
  @media (max-width: 720px) { .main { padding: 18px 14px; } }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); margin-top: 4px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 12px;
    padding: 9px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--ink-2);
  }
  .pill svg { width: 16px; height: 16px; stroke: var(--muted); }
  .pill .strong { color: var(--ink); font-weight: 600; }
  @media (max-width: 720px) { .pills { display: none; } }

  /* ---------- Agent-down banner ---------- */
  .downbanner {
    margin-top: 16px; background: var(--crit-soft); color: var(--crit);
    border: 1px solid #f4c4c3; border-radius: 13px; padding: 12px 16px;
    font-weight: 600; display: flex; align-items: center; gap: 10px;
    max-width: 760px;
  }
  .downbanner svg { stroke: currentColor; flex: none; }

  /* ---------- Inbox ---------- */
  .chips { display: flex; gap: 8px; margin: 18px 0 14px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 170px; max-width: 320px; border: 1px solid var(--hair);
    border-radius: 999px; padding: 7px 16px; font-size: 13px; font-family: inherit;
    background: var(--surface); color: var(--ink); outline: none;
  }
  .search:focus { border-color: var(--primary); }
  .cancelbtn {
    border: 1.5px solid var(--hair); background: var(--surface); color: var(--muted);
    border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 12.5px;
    cursor: pointer; transition: all .15s; flex: none; font-family: inherit;
  }
  .cancelbtn:hover { border-color: var(--crit); color: var(--crit); }
  .cancelbtn.armed { background: var(--crit); border-color: var(--crit); color: #fff; }
  .chip {
    border: 1px solid var(--hair); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .feed { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
  .item {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; display: flex; gap: 14px;
    transition: opacity .2s;
  }
  .item.done { opacity: .55; }
  .item-ic {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    flex: none;
  }
  .item-ic svg { width: 21px; height: 21px; }
  .item-body { flex: 1; min-width: 0; }
  .item-top { display: flex; align-items: baseline; gap: 8px; }
  .item-kind { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .item-when { color: var(--muted); font-size: 12px; margin-left: auto; flex: none; }
  .item-name { font-weight: 700; font-size: 16px; margin-top: 4px; }
  .item-line { color: var(--ink-2); margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
  .item-line b { color: var(--ink); font-weight: 600; }
  .item-price { font-weight: 700; color: var(--ink); }
  .tel {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 9px;
    background: var(--primary-soft); color: var(--primary); font-weight: 700;
    border-radius: 10px; padding: 8px 13px; text-decoration: none; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .tel svg { width: 15px; height: 15px; stroke: currentColor; }
  .item-foot { display: flex; align-items: center; gap: 14px; margin-top: 11px; }
  .viewcall {
    background: none; border: 0; color: var(--ink-2); font-size: 12.5px; font-weight: 600;
    cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 5px;
    font-family: inherit;
  }
  .viewcall:hover { color: var(--primary); }
  .viewcall svg { width: 14px; height: 14px; stroke: currentColor; }
  .check {
    margin-left: auto; border: 1.5px solid var(--hair); background: var(--surface);
    color: var(--ink-2); border-radius: 10px; padding: 8px 14px; font-weight: 600;
    font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s; flex: none; font-family: inherit;
  }
  .check svg { width: 15px; height: 15px; stroke: currentColor; }
  .check:hover { border-color: var(--good); color: var(--good-ink); }
  .check.on { background: var(--good-soft); border-color: transparent; color: var(--good-ink); }
  .empty {
    text-align: center; color: var(--muted); padding: 56px 20px; max-width: 760px;
    background: var(--surface); border: 1px dashed var(--hair); border-radius: var(--radius);
  }
  .empty svg { width: 34px; height: 34px; stroke: var(--muted); margin-bottom: 10px; }

  /* ---------- Calls ---------- */
  .calls { display: flex; flex-direction: column; gap: 10px; max-width: 760px; margin-top: 18px; }
  .callrow {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px; display: flex; align-items: center;
    gap: 14px; cursor: pointer; width: 100%; text-align: left; font-family: inherit; font-size: 14px;
  }
  .callrow:hover { border-color: #d8d5f5; }
  .call-ic {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary); flex: none;
  }
  .call-ic svg { width: 18px; height: 18px; stroke: currentColor; }
  .call-when { font-weight: 600; }
  .call-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-left: auto; flex: none; }
  .b-good { background: var(--good-soft); color: var(--good-ink); }
  .b-warn { background: var(--warn-soft); color: #b56a15; }
  .b-mute { background: var(--track); color: var(--ink-2); }
  .b-crit { background: var(--crit-soft); color: var(--crit); }

  /* ---------- Transcript drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(20,22,32,.4); z-index: 40; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 41;
    background: var(--bg); display: flex; flex-direction: column;
    box-shadow: -12px 0 40px rgba(16,24,40,.18); animation: slidein .18s ease;
  }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
  .drawer-h {
    background: var(--surface); border-bottom: 1px solid var(--hair);
    padding: 16px 18px; display: flex; align-items: center; gap: 12px;
  }
  .drawer-h .x {
    margin-left: auto; border: 0; background: var(--track); border-radius: 10px;
    width: 34px; height: 34px; cursor: pointer; color: var(--ink-2); font-size: 16px;
    font-family: inherit;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 15px; line-height: 1.45; overflow-wrap: anywhere; }
  .bub-agent { background: var(--surface); border: 1px solid var(--hair); align-self: flex-start; border-bottom-left-radius: 5px; }
  .bub-caller { background: var(--primary-soft); align-self: flex-end; border-bottom-right-radius: 5px; }
  .bub-tool { align-self: center; color: var(--muted); font-size: 11.5px; font-style: italic; padding: 0 8px; text-align: center; }

  /* ---------- Overview (KPIs, charts, table) ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; display: flex; gap: 15px; align-items: flex-start;
  }
  .kpi-ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: none; }
  .kpi-ic svg { width: 23px; height: 23px; }
  .kpi-label { color: var(--ink-2); font-size: 13px; }
  .kpi-val { font-size: 27px; font-weight: 800; margin-top: 3px; letter-spacing: -.02em; }
  .kpi-delta { font-size: 12px; margin-top: 7px; color: var(--muted); }
  .kpi-delta .up { color: var(--good-ink); font-weight: 700; }
  .kpi-delta .down { color: var(--crit); font-weight: 700; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .card-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .card-title { font-size: 16px; font-weight: 700; }

  .occ-head, .occ-row { display: grid; grid-template-columns: 108px 1fr 74px 52px; align-items: center; gap: 14px; }
  .occ-head { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .occ-row { padding: 9px 0; }
  .occ-name { font-weight: 600; }
  .occ-track { height: 9px; background: var(--track); border-radius: 6px; overflow: hidden; }
  .occ-fill { height: 100%; border-radius: 6px; }
  .occ-count { color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
  .occ-pct { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 22px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hair); color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .chart { display: flex; gap: 12px; }
  .yaxis { display: flex; flex-direction: column; justify-content: space-between; height: 260px; padding-bottom: 26px; color: var(--muted); font-size: 12px; text-align: right; width: 56px; }
  .plotwrap { flex: 1; min-width: 0; }
  .plot { position: relative; height: 260px; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); }
  .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; }
  .barcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 22%; }
  .barval { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 7px; font-variant-numeric: tabular-nums; }
  .bar { width: 62px; max-width: 70%; background: var(--primary-bar); border-radius: 7px 7px 0 0; transition: height .5s ease, filter .15s; }
  .bar:hover { filter: brightness(1.06); }
  .xaxis { display: flex; justify-content: space-around; margin-top: 8px; color: var(--ink-2); font-size: 13px; }
  .xaxis span { width: 22%; text-align: center; }

  .tablewrap { margin-top: 4px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 10px 14px; white-space: nowrap; }
  tbody td { padding: 14px; border-top: 1px solid var(--hair); white-space: nowrap; }
  tbody tr:hover { background: #fafafb; }
  .ref { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .dates { color: var(--ink-2); }
  .arrow { color: var(--muted); margin: 0 4px; }
  .rbadge { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .tfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; color: var(--muted); font-size: 13px; }

  @media (max-width: 1050px) { .kpis { grid-template-columns: repeat(2,1fr); } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi { padding: 14px; } .kpi-val { font-size: 22px; } }
</style>
</head>
<body>
<div id="root"></div>

     real components and hooks, no build step for the installer. -->

<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/htm.umd.js"></script>
<script src="/static/dashboard.js"></script>

</html>
