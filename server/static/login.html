<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{brand}</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --primary: #6c5ce7; --ink: #1b1f2a;
    --ink-2: #6b7280; --hair: #edeef2; --crit: #ef5350;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); }
  .card {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 18px;
    box-shadow: 0 1px 3px rgba(16,24,40,.08); padding: 34px 30px; width: min(360px, calc(100vw - 32px));
    text-align: center;
  }
  .crest {
    width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%;
    display: grid; place-items: center; border: 2px solid var(--primary); color: var(--primary);
  }
  .brand { font-weight: 700; letter-spacing: .12em; font-size: 15px; text-transform: uppercase; }
  .hint { color: var(--ink-2); font-size: 13px; margin: 6px 0 22px; }
  input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--hair); border-radius: 11px;
    font-size: 15px; font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--primary); }
  button {
    width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 11px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .6; }
  .err { color: var(--crit); font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<form class="card" id="form">
  <div class="crest">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6v11a3 3 0 0 1-6 0z M6 11a6 6 0 0 0 12 0 M12 17v4"/>
    </svg>
  </div>
  <div class="brand">{brand}</div>
  <div class="hint">{login_title}</div>
  <input type="password" id="password" placeholder="{password}" autocomplete="current-password" autofocus />
  <button type="submit" id="go">{sign_in}</button>
  <div class="err" id="err"></div>
</form>
<script>
  const form = document.getElementById("form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const go = document.getElementById("go");
    go.disabled = true;
    document.getElementById("err").textContent = "";
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    if (r.ok) { location.reload(); return; }
    document.getElementById("err").textContent = "{wrong_password}";
    go.disabled = false;
  });
</script>
</body>
</html>
