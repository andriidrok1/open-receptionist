# Аварійна служба — найсильніший випадок для голосового ресепшену.
# Людина о 23:00 обдзвонює список підряд, і замовлення дістається тому, хто взяв
# трубку. Тому графік цілодобовий, крок сітки маленький, а «запис» — це виїзд.
key: emergency
name: аварійна служба «Швидка допомога дому»
brand: Швидка допомога дому
city: Київ, Україна
agent_name: Оксана
persona: диспетчер аварійної служби
tone: >-
  Будь короткою і спокійною. Людина дзвонить, коли її топить або немає світла —
  їй потрібна не ввічливість, а швидка відповідь «їдемо, за годину».
currency: грн

customer:
  nom: клієнт
  gen: клієнта
  dat: клієнту

speech:
  bad: >-
    Отже, виклик сантехніка за адресою Хрещатик, двадцять два, квартира п'ять.
    Вартість виїзду становить п'ятсот гривень. Підтверджуєте замовлення?
  good: >-
    Зрозуміла, протікає стояк. Майстер може бути за годину — виїзд п'ятсот, роботи окремо. Їдемо?
  recap: >-
    Записую сантехніка на Хрещатик двадцять два, квартира п'ять, сьогодні о дев'ятій вечора,
    на Тараса <break time="0.4s" /> виїзд п'ятсот. Все вірно?

knowledge: |
  Працюємо цілодобово, сім днів на тиждень, по Києву.
  Виїзд майстра: сантехнік — 500 грн, електрик — 500 грн, аварійне відкриття дверей — 700 грн,
  аварійне відключення води по стояку — 600 грн.
  Це ціна виїзду й діагностики. Вартість самих робіт і матеріалів майстер називає
  на місці, після того як побачить, — по телефону її не вгадати.
  Звичайний час прибуття по Києву — від сорока хвилин до півтори години,
  залежно від району й завантаження.
  Оплата готівкою або на картку після роботи.

escalation_examples: >-
  запах газу, іскрить проводка з димом, потоп у сусідів знизу, страхова,
  скарга на майстра, гарантія на попередні роботи

keyterms: [аварія, сантехнік, електрик, протікає, затоплює, вибило, замок, стояк]

demo:
  tab: Аварійка
  intro: >-
    Оксана приймає аварійні виклики цілодобово: питає, що сталося й куди їхати,
    називає вартість виїзду й найближчий час, коли буде майстер. Ціну самих
    робіт не вигадує — її скаже майстер на місці. Небезпечні випадки (газ, дим)
    одразу передає людині.
  try:
    - У мене протікає труба під раковиною, потрібен сантехнік
    - Вибило електрику в усій квартирі
    - Скільки коштує відкрити двері, якщо загубив ключі?

booking:
  enabled: true
  granularity: slots
  action: виклик
  action_gen: виклику
  verb: викликати
  resource_param: service
  resource_label: послуга
  ask_party: false
  ref_prefix: "АВ-"
  slot_step_min: 30
  horizon_days: 7
  # Цілодобово: аварія не питає графік.
  hours:
    mon: "00:00-23:59"
    tue: "00:00-23:59"
    wed: "00:00-23:59"
    thu: "00:00-23:59"
    fri: "00:00-23:59"
    sat: "00:00-23:59"
    sun: "00:00-23:59"
  intake:
    - key: address
      label: адреса
      description: Вулиця, номер будинку і квартири, куди їхати
      required: true
    - key: problem
      label: що сталося
      description: Суть аварії своїми словами — що тече, де іскрить, що не працює
      required: true
    - key: access
      label: як потрапити
      description: Код домофону, поверх, чи є хтось удома
      required: false
  resources:
    # capacity = скільки бригад цього профілю на зміні
    - key: plumber
      note: виїзд і діагностика
      label: Сантехнік
      aliases: [сантехніка, труба, протікає, тече, затоплює, стояк, кран, унітаз]
      price: 500
      duration_min: 60
      capacity: 2
    - key: electrician
      note: виїзд і діагностика
      label: Електрик
      aliases: [електрика, електрику, вибило, немає світла, іскрить, розетка, щиток]
      price: 500
      duration_min: 60
      capacity: 2
    - key: locksmith
      note: виїзд і діагностика
      label: Аварійне відкриття дверей
      aliases: [замок, ключі, зачинилися, відкрити двері, загубив ключі]
      price: 700
      duration_min: 60
      capacity: 1
    - key: water_shutoff
      note: виїзд і діагностика
      label: Відключення води по стояку
      aliases: [перекрити воду, відключити стояк, перекрити стояк]
      price: 600
      duration_min: 60
      capacity: 1
