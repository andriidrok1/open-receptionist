# Клінінг — виїзд до клієнта (granularity: slots + адреса в опитуванні).
# Прайс розведений за розміром житла окремими позиціями: у ресурса одна ціна,
# а двокімнатна й трикімнатна коштують по-різному. Простіше, ніж множники.
key: cleaning
name: клінінг-сервіс «Чисто»
brand: Чисто
city: Київ, Україна
agent_name: Оксана
persona: адміністратор клінінг-сервісу
tone: Будь спокійною і практичною — тут цінують конкретику, а не люб'язності.
currency: грн

customer:
  nom: клієнт
  gen: клієнта
  dat: клієнту

speech:
  bad: >-
    Отже, підтримуюче прибирання двокімнатної квартири у вівторок, дванадцятого серпня,
    о десятій годині ранку. Вартість становить одну тисячу двісті гривень. Підтверджуєте замовлення?
  good: >-
    Так, у вівторок о десятій вільно. Двокімнатна — тисяча двісті. Записую?
  recap: >-
    Записую прибирання двокімнатної, у вівторок о десятій, на Тараса.
    Хрещатик двадцять два, квартира п'ять <break time="0.4s" /> тисяча двісті. Все вірно?

knowledge: |
  Підтримуюче прибирання: однокімнатна — 800 грн (2 год), двокімнатна — 1200 грн (3 год),
  трикімнатна — 1600 грн (4 год).
  Генеральне прибирання: однокімнатна — 1800 грн (4 год), двокімнатна — 2600 грн (5 год).
  Миття вікон рахується окремо, ціну скаже бригадир на місці.
  Працюємо пн–сб з 8:00 до 20:00, неділя — вихідний. Виїжджаємо по Києву.
  Засоби й техніка наші. Оплата готівкою або на картку після прибирання.
  Постійним клієнтам (щотижня або раз на два тижні) — знижка 15%.

escalation_examples: офіси, після ремонту, хімчистка меблів, скарга на бригаду, миття вікон

keyterms: [прибирання, генеральне, підтримуюче, клінінг, квартира, вікна]

demo:
  tab: Клінінг
  intro: >-
    Оксана приймає замовлення на прибирання: питає розмір житла, коли зручно й
    куди їхати, перевіряє вільні бригади й записує. Те, чого не знає — ціну на
    вікна, офіси, після ремонту — чесно передає людині.
  try:
    - Хочу замовити прибирання двокімнатної
    - Скільки коштує генеральне прибирання?
    - А після ремонту прибираєте?

booking:
  enabled: true
  granularity: slots
  action: замовлення
  action_gen: замовлення
  verb: замовити
  resource_param: service
  resource_label: послуга
  ask_party: false
  ref_prefix: "ЗМ-"
  slot_step_min: 60
  horizon_days: 60
  hours:
    mon: "08:00-20:00"
    tue: "08:00-20:00"
    wed: "08:00-20:00"
    thu: "08:00-20:00"
    fri: "08:00-20:00"
    sat: "08:00-20:00"
    sun: null
  # Без адреси замовлення на виїзд — брак: бригада не знає, куди їхати.
  intake:
    - key: address
      label: адреса
      description: Вулиця, номер будинку і квартири, куди приїхати
      required: true
    - key: access
      label: як потрапити
      description: Код домофону, поверх, паркінг — усе, що сказали про доступ
      required: false
  resources:
    # capacity = скільки бригад можуть виїхати одночасно
    - key: regular_1
      label: Підтримуюче однокімнатна
      aliases: [однокімнатна, одна кімната, однушка, підтримуюче однокімнатної]
      price: 800
      duration_min: 120
      capacity: 3
    - key: regular_2
      label: Підтримуюче двокімнатна
      aliases: [двокімнатна, дві кімнати, двушка, підтримуюче двокімнатної]
      price: 1200
      duration_min: 180
      capacity: 3
    - key: regular_3
      label: Підтримуюче трикімнатна
      aliases: [трикімнатна, три кімнати, трьохкімнатна]
      price: 1600
      duration_min: 240
      capacity: 2
    - key: deep_1
      label: Генеральне однокімнатна
      aliases: [генеральне однокімнатної, генералка однокімнатна]
      price: 1800
      duration_min: 240
      capacity: 2
    - key: deep_2
      label: Генеральне двокімнатна
      aliases: [генеральне, генералка, генеральне двокімнатної]
      price: 2600
      duration_min: 300
      capacity: 2
