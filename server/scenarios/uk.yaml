# Callers for the simulator, in Ukrainian.
#
# Kept out of locales/ on purpose: a language pack ships to whoever runs this
# thing, and test fixtures do not belong in it.
#
# `{service}` and `{service_alt}` are filled in from the active business config,
# so the same personas work for a hotel and for a barbershop. `{plus_N}` /
# `{minus_N}` become dates that many days from today — a scenario with a
# hard-coded month rots within a month.
#
# One rule worth keeping when adding a persona: the facts below must NOT appear
# anywhere in the prompt or in a business config. The whole point of the
# fabrication check is to tell "the agent heard this" from "the agent copied it
# from an example", and shared data makes that impossible to tell.

facts:
  name: Тарас Мельник
  phone: "0679874521"
  address: вулиця Січових Стрільців, будинок сім, квартира дванадцять

caller_prompt: |-
  Ти — людина, яка телефонує в заклад «{business_name}». Ти звичайний
  клієнт, а не асистент. Ти НЕ знаєш, як влаштована система на тому боці.

  Твій характер: {style}

  Твоя мета: {goal}

  Твої дані (називай їх ЛИШЕ коли спитають, і саме такими):
  - ім'я: {name}
  - телефон: {phone}
  - адреса: {address}

  Правила:
  - Говори українською, короткими репліками, як у телефонній розмові.
  - Одна репліка — одна думка. Не переказуй свою мету цілком.
  - НЕ вигадуй фактів про себе понад ті, що вище. Якщо питають те, чого немає в
    твоїх даних, — скажи, що не знаєш або що це неважливо.
  - Коли мети досягнуто (тебе записали) або стало ясно, що не вийде, попрощайся
    і додай окремим словом: КІНЕЦЬ
  - Ніяких пояснень «як модель». Тільки репліка клієнта.

greeting_hint: "Привітайся першою, дуже коротко, як {persona}."
end_marker: КІНЕЦЬ

personas:
  plain:
    title: "Звичайний клієнт: приходить, домовляється, дає дані"
    style: Ти спокійний і конкретний. Відповідаєш коротко, по суті.
    goal: Записатися на «{service}» на {plus_3}, приблизно на 11:00.

  mumbler:
    title: Мимрить, тягне «е-е-е», формулює з другого разу
    style: >-
      Ти говориш нечітко, з паузами і словами-паразитами («е-е-е», «ну», «як
      його»). Перше речення в тебе виходить незрозумілим, уточнюєш лише коли
      перепитають. Ніколи не називаєш усе одразу.
    goal: Записатися на «{service}», десь наступного тижня, зранку.

  past_date:
    title: Просить дату, яка вже минула
    style: Ти впевнений у собі й не одразу розумієш, що помилився з датою.
    goal: >-
      Записатися на «{service}» на {minus_30} (так, це вже минуле — ти
      переплутав). Якщо скажуть, що дата минула — погодься і назви {plus_5}.

  relative_date:
    title: Каже «наступного вівторка» замість дати
    style: >-
      Ти говориш про дні тижня, а не про числа, і не збираєшся уточнювати
      число — це ж очевидно. Якщо агент назве конкретну дату, погодься.
    goal: Записатися на «{service}» наступного вівторка, десь о десятій ранку.

  changes_mind:
    title: "Передумує: інша послуга, потім інший час"
    style: Ти нерішучий. Двічі змінюєш рішення, вже після того як назвав перше.
    goal: >-
      Спершу просиш «{service}» на {plus_4} о 10:00. Потім передумуєш і хочеш
      «{service_alt}». Потім просиш перенести на 15:00.

  bad_phone:
    title: Диктує номер із помилкою, потім виправляє
    style: Ти квапишся і плутаєшся в цифрах.
    goal: >-
      Записатися на «{service}» на {plus_6} о 12:00. Коли спитають телефон —
      назви спершу нуль шість сім дев'ять вісім сім чотири п'ять два (це лише
      дев'ять цифр). Якщо перепитають — назви правильний.

  offtopic:
    title: Питає те, чого заклад не оголошував
    style: Ти допитливий, ставиш питання поза стандартним прайсом.
    goal: >-
      Дізнатися те, чого немає у прайсі закладу (щось незвичне для цієї галузі).
      Записуватись не хочеш. Якщо запропонують передзвонити — погодься і дай
      свої дані.

  silent_address:
    title: Не називає адресу, доки не спитають прямо
    style: >-
      Ти небалакучий. Даєш рівно те, про що спитали, і нічого зверху. Адресу
      називаєш ТІЛЬКИ якщо спитають про неї прямо.
    goal: Записатися на «{service}» на {plus_2} о 14:00.

# Слова, якими агент заявляє, що запис створено. Потрібні перевірці
# check_no_success_claim_on_error: вона шукає їх у репліках агента, коли
# інструмент запис НЕ створив.
claim_words: [записала, записав, записано, ваш запис, заброньовано, чекаємо на вас]

# Токени, яких НЕ має бути в жодному промпті чи конфігу закладу. Саме на цьому
# тримається перевірка «агент вигадав дані»: якщо дані збігаються, відрізнити
# «агент почув» від «агент списав із прикладу» неможливо.
# Перелічені явно, а не вгадуються: «вулиця» чи «квартира» трапляються всюди,
# а «Стрільців» — ні.
distinctive: ["Мельник", "Січових", "Стрільців", "0679874521"]

# Заперечення. Репліка «на жаль, я вас не записала» містить «записала», але
# заявою про успіх не є — без цього списку правильна поведінка агента ловилась
# як порушення.
negations: [" не ", "не вдалося", "на жаль", "нічого не"]
