# Invented names for demo data (seed_demo.py). An English panel full of
# Ukrainian surnames reads as an unfinished product.
fixtures:
  first_names: [James, Maria, David, Sarah, Michael, Emily, Robert, Jessica,
                William, Ashley, Daniel, Amanda, Christopher, Nicole, Brian, Laura]
  last_names: [Miller, Johnson, Garcia, Brown, Davis, Rodriguez, Wilson, Martinez,
               Anderson, Taylor, Thomas, Moore]
  # Callback topics for seeded messages — vertical-neutral on purpose: the same
  # pack seeds a hotel, a clinic and a plumber.
  callback_topics:
    ["billing question about the last visit — please call back",
     "asks for an invoice with the company details",
     "wants to speak to the owner about a recurring arrangement",
     "asks if an earlier time can open up today",
     "question about paying by card on site",
     "asks whether you serve their area"]

# End-of-turn detection. Words a sentence almost never stops on: if the line
# trails off on one of these it is a pause, not an ending, and the wait should
# be longer. Cutting someone off mid-thought is worse than half a second lost.
turn_taking:
  # Quoted on purpose: YAML reads bare on/off/yes/no as booleans, and an
  # unquoted `on` here silently became True — which then crashed the classifier
  # rather than just misbehaving. Cheap to hit, confusing to diagnose.
  continuations: ["and", "or", "but", "so", "because", "that", "which", "who",
                  "when", "while", "if", "the", "a", "an", "my", "your", "our",
                  "their", "his", "her", "its", "this", "these", "those", "to",
                  "of", "in", "on", "at", "for", "with", "from", "by", "about",
                  "into", "like", "is", "are", "was", "were", "am", "be", "been",
                  "do", "does", "did", "can", "could", "would", "should", "will",
                  "want", "need", "have", "has", "had", "it's", "i'd", "i'm",
                  "we're", "there's", "let's", "one", "two", "three",
                  "four", "five", "six", "seven", "eight", "nine", "zero",
                  "street", "avenue", "apartment", "number"]
  sentence_end: ".!?…"

# Choosing a voice by ear (voice_lab.py). Optional — a development tool, not
# something a call needs, so it stays out of the pack contract and a new
# language pack is not obliged to fill it in.
voice_lab:
  # What to ask the ElevenLabs library for: their own language filter, plus
  # search words for voices that are tagged loosely.
  search_language: en
  search_terms: [american, receptionist, customer service]
  # Every candidate reads THESE TWO LINES and nothing else, which is what makes
  # the comparison fair. The second is deliberately stuffed with a date, a time,
  # a price and a phone number — the hardest things for a synthesiser and the
  # ones this agent says on every single call.
  samples:
    greeting: "Hi, this is Emma at Bright Smile Dental. How can I help you today?"
    booking: "So that's a cleaning on Friday, August fourteenth at twelve PM, a hundred and eighty dollars. Your number is four one five, three two one, one two three five. Does that sound right?"

# The showcase page (static/demo.html). Separate from `dashboard:` because the
# two have different readers: the dashboard is for whoever runs the business,
# this is for a visitor deciding whether the thing works at all.
#
# What this section does NOT cover: the business cards themselves. A Ukrainian
# clinic keeps its Ukrainian name, prices and opening hours whatever the page
# language is set to — those come from its own config, and translating them
# would be inventing a business that does not exist.
demo:
  language_name: English
  title: Voice receptionist — demo
  logo: Voice receptionist
  badge: demo · no real bookings are made
  lede: >-
    Pick your industry and call, exactly the way your customer would.
    Voice, in the browser, nothing to install.
  language_label: Language
  # The number beside each option is the measured wait before the first
  # sound, which is the only reason the choice exists.
  voice_model_label: Voice model

  call: Call
  call_again: Call again
  hang_up: Hang up
  connecting: Connecting…
  hint_cancel: press again to cancel
  go_ahead: Go ahead
  hint_hang_up: press again to hang up
  listening: Listening
  hint_speak_normally: speak in your normal voice
  thinking: One moment…
  hint_a_second: just a second
  speaking: "{agent} is speaking"
  hint_interrupt: interrupt whenever you like
  answers_in: "{agent} answers in {language}"
  # Quotation marks differ by language, and the wrong ones are one of the
  # tells that a page was translated rather than written.
  quote_open: "“"
  quote_close: "”"

  section_prices: "Prices {agent} knows"
  section_asks: Will also ask
  section_try: Try saying
  section_talk: Conversation
  section_result: What the front desk sees

  actions:
    check_availability: checked what was free
    create_booking: created the record
    take_message: logged a callback request

  record_new: "New {action}"
  record_message: Callback request
  row_customer: Customer
  row_where: Where
  row_what: What
  row_when: When
  row_total: Total
  row_details: Details
  row_question: Question
  today: today

  result_looking: Checking what appeared in the system…
  result_empty: >-
    Nothing was recorded for this call — try taking the conversation
    through to a booking.

  timer_ends_in: "the demo call ends in {n}s"
  limit_reached: "Demo calls are capped at {n} min — press to call again."

  err_industries: Could not load the list of industries.
  err_none_configured: No industries are configured.
  err_bot_down: "The bot for this industry is not answering (port {port})."
  err_connect: >-
    Could not connect to the bot (port {port}). Check your connection,
    and that run_demo.py is running.
  err_https: >-
    The microphone only works over https, or from localhost.
    Open the demo over a secure link.
  err_mic: >-
    The browser did not grant microphone access — the bot cannot hear you.
    Allow the microphone in the site settings and call again.
  err_audio_blocked: The browser blocked the sound. Press “Enable sound”.
  enable_sound: Enable sound

# Words that make up spoken numbers, dates, times and money. Used to find where
# a pause helps: the agent says a date, a price and a phone number on almost
# every call, and those are the moments a caller needs a beat to take in.
#
# Digits are useless for this — the prompt tells the model to say numbers the way
# a person does, so "180" reaches synthesis as "a hundred and eighty dollars".
# Month and weekday names are NOT repeated here; they are read from `calendar`
# and `numbers`, so there is one place to correct them.
speech:
  # Digits as they are said out loud. Used to check that a phone number the
  # agent is about to book with actually came from the caller: speech
  # recognition writes "four one five" as often as "415", and the two have to
  # collapse to the same thing before they can be compared.
  digit_words: {zero: "0", oh: "0", one: "1", two: "2", three: "3", four: "4",
                five: "5", six: "6", seven: "7", eight: "8", nine: "9"}
  # How the agent signs off. Matched against the LAST sentence of a reply, and
  # when it matches the line is hung up from code — ending the call is a tool
  # the model has and does not reliably reach for, and on a phone line the
  # result is a bill that runs until the caller works out they should hang up.
  # "goodnight" earned its place from a transcript: the agent said "You're
  # welcome. Goodnight!" — a perfect place to hang up — and then traded twelve
  # more goodbyes because the word was not on this list.
  goodbye_words: [bye, goodbye, "take care", "have a good one", "see you",
                  goodnight, "good night"]
  # Counted as part of a run only BETWEEN other number words, never at its edges
  # — otherwise an ordinary "at the desk" would look like the start of a time.
  glue_words: [and, at, past, to, a, the, of, "on"]
  number_words: [zero, oh, one, two, three, four, five, six, seven, eight, nine,
                 ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen,
                 seventeen, eighteen, nineteen, twenty, thirty, forty, fifty,
                 sixty, seventy, eighty, ninety, hundred, thousand,
                 first, second, third, fourth, fifth, sixth, seventh, eighth,
                 ninth, tenth, eleventh, twelfth, thirteenth, fourteenth,
                 fifteenth, sixteenth, seventeenth, eighteenth, nineteenth,
                 twentieth, thirtieth,
                 "am", "pm", "o'clock", noon, midnight, half, quarter,
                 dollar, dollars, cent, cents, euro, euros, pound, pounds]
