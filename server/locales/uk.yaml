# Вигадані імена для демо-даних (seed_demo.py). Англомовна панель, повна
# українських прізвищ, виглядає як недороблений продукт.
fixtures:
  first_names: [Андрій, Олена, Ігор, Марія, Юлія, Олександр, Наталія, Дмитро,
                Софія, Максим, Ірина, Богдан, Тетяна, Віктор, Оксана, Сергій]
  # Прізвища НЕ мають перетинатись із даними тестового клієнта (scenarios/uk.yaml),
  # інакше перевірка «агент вигадав ім'я» осліпне на збігу.
  last_names: [Коваленко, Сидоренко, Ткаченко, Бондаренко, Шевченко, Захарченко,
               Кравченко, Бойко, Ковальчук, Поліщук, Гончаренко, Лисенко]
  # Теми для сідованих повідомлень — навмисно без прив'язки до галузі: один
  # пак сідує і готель, і клініку, і сантехніка.
  callback_topics:
    ["питання щодо рахунку за останній візит — просить передзвонити",
     "просить рахунок-фактуру з реквізитами",
     "хоче поговорити з власником про постійну співпрацю",
     "питає, чи не звільниться раніший час сьогодні",
     "питання про оплату карткою на місці",
     "уточнює, чи обслуговуєте їхній район"]

# Визначення кінця ходу. Слова, після яких речення майже напевно продовжиться:
# якщо репліка обірвалась на них — це пауза, а не кінець думки, і чекати треба
# довше. Перебити людину на півслові гірше, ніж зачекати зайві пів секунди.
turn_taking:
  continuations: [і, й, та, а, але, або, чи, що, щоб, бо, як, коли, якщо, де,
                  на, в, у, до, з, із, зі, за, під, над, при, про, від, для,
                  без, по, через, мені, треба, хочу, буде, було, це,
                  той, те, ще, теж, також, значить, тобто, ну, тому,
                  один, два, три, чотири, "п'ять", шість, сім, вісім,
                  "дев'ять", нуль, номер, вулиця, будинок, квартира]
  sentence_end: ".!?…"

# Вибір голосу на слух (voice_lab.py). Необов'язкова секція — це інструмент
# розробки, а не те, що потрібне дзвінку, тому вона не входить у контракт паку.
voice_lab:
  search_language: uk
  search_terms: [ukrainian, українська]
  samples:
    greeting: "Добрий день! Готель «Рів'єра», мене звати Оксана. Чим можу допомогти?"
    booking: "Отже, номер Покращений на двох, з чотирнадцятого по сімнадцяте липня, три ночі. Разом п'ять тисяч чотириста гривень. Підтверджуєте бронювання?"

# Сторінка-вітрина (static/demo.html). Окремо від `dashboard:`, бо читачі різні:
