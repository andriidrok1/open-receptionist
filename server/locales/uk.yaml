# Слова, з яких складаються числа, дати, час і гроші вголос. Потрібні, щоб
# знайти місце для паузи: дату, ціну й телефон агент промовляє майже в кожному
# дзвінку, і саме там людині треба мить, щоб усвідомити почуте.
#
# Шукати цифри марно — промпт вимагає промовляти числа словами, тож до синтезу
# «5400» доходить як «п'ять тисяч чотириста гривень». Назви місяців і днів тижня
# тут НЕ дублюються: вони беруться з `calendar` і `numbers`, щоб виправляти
# доводилось в одному місці.
speech:
  # Цифри так, як їх вимовляють. Потрібні, щоб перевірити: номер, з яким агент
  # збирається записати, справді назвав клієнт. Розпізнавання пише «чотири один
  # п'ять» не рідше, ніж «415», і обидва треба звести до одного вигляду.
  digit_words: {нуль: "0", один: "1", одна: "1", два: "2", дві: "2", три: "3",
                чотири: "4", "п'ять": "5", шість: "6", сім: "7", вісім: "8",
                дев'ять: "9"}
  # Як агент прощається. Звіряється з ОСТАННІМ реченням репліки, і після збігу
  # лінія кладеться з коду: завершення дзвінка — інструмент, до якого модель
  # тягнеться ненадійно, а в телефонії це рахунок, який цокає, доки клієнт не
  # здогадається покласти слухавку першим.
  goodbye_words: [до побачення, бувайте, на все добре, до зустрічі,
                  всього доброго, надобраніч]
  # Враховуються лише МІЖ іншими числівниками, ніколи скраю — інакше звичайне
  # «на стійці» виглядало б як початок часу.
  glue_words: [і, й, та, на, о, об, по, до, з, за, у, в]
  number_words: [нуль, один, одна, два, дві, три, чотири, п'ять, шість, сім,
                 вісім, дев'ять, десять, одинадцять, дванадцять, тринадцять,
                 чотирнадцять, п'ятнадцять, шістнадцять, сімнадцять,
                 вісімнадцять, дев'ятнадцять, двадцять, тридцять, сорок,
                 п'ятдесят, шістдесят, сімдесят, вісімдесят, дев'яносто,
                 сто, двісті, триста, чотириста, п'ятсот, шістсот, сімсот,
                 вісімсот, дев'ятсот, тисяча, тисячі, тисяч,
                 перше, друге, третє, четверте, п'яте, шосте, сьоме, восьме,
                 дев'яте, десяте, першого, другого, третього, четвертого,
                 п'ятого, шостого, сьомого, восьмого, дев'ятого, десятого,
                 одинадцятого, дванадцятого, тринадцятого, чотирнадцятого,
                 п'ятнадцятого, шістнадцятого, сімнадцятого, вісімнадцятого,
                 дев'ятнадцятого, двадцятого, тридцятого,
                 година, години, годин, годині, ранку, дня, вечора, ночі,
                 пів, чверть, гривня, гривні, гривень, копійок, євро, доларів]
