[project]
name = "open-receptionist"
version = "0.1.0"
description = "Self-hosted voice receptionist for small businesses — one YAML per business"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt, not here: this is an application,
# not a library, and there is nothing to `pip install -e`. Keeping the list in one
# place stops the two from drifting apart.
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "playwright>=1.40",  # лише для скріншотів дашборда під час розробки
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]