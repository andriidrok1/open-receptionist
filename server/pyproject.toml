[project]
name = "hotel-voice-agent"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[openai,deepgram,elevenlabs,runner,silero,webrtc]>=1.4.0",
    "pipecatcloud",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "playwright>=1.40",  # лише для скріншотів дашборда під час розробки
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]