# Every push and PR: lint + the full deterministic suite on a clean machine.
# The tests need no API keys, no network and no audio hardware by design —
# which is what makes this badge cheap to keep green and honest to show.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install
        run: |
          pip install -r server/requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check server/
      - name: Tests
        run: python -m pytest server/tests -q
